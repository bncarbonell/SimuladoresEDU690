;padding:22px;z-index:10}.overlay.show{display:flex}.dialog{position:relative;width:min(680px,95vw);max-height:85vh;overflow:auto;min-height:310px;background:white;border-radius:8px;padding:clamp(28px,5vw,65px) clamp(24px,4vw,48px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 16px 60px #0005}.dialog h2{font-size:clamp(21px,2.4vw,26px);margin:0 0 28px}.dialog p{font-size:17px;line-height:1.55;margin:0}.close{position:absolute;right:12px;top:10px;border:0;background:#eee;border-radius:5px;font-size:28px;width:42px;height:42px;cursor:pointer}.action{margin-top:24px;padding:11px 18px;background:#143e63;color:white;border-radius:6px;text-decoration:none;display:none}.hint{color:white;text-align:center;padding:10px;font-size:14px}@media(max-width:700px){.dialog{min-height:260px}.dialog p{font-size:15px}}</style></head><body><main class="wrap"><div class="scene" id="scene" aria-label="Auditorio virtual con trece puntos interactivos"></div><p class="hint">Selecciona cualquiera de los puntos azules para leer las instrucciones. Presiona Esc para cerrar.</p></main><div class="overlay" id="overlay" role="presentation"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="heading"><button class="close" id="close" aria-label="Cerrar">×</button><h2 id="heading"></h2><p id="body"></p><a id="action" class="action" target="_blank" rel="noopener noreferrer">Abrir recurso ↗</a></section></div><script>const items=[["Chat", "Utiliza el chat como herramienta de interacción. Comparte tus reflexiones, haz preguntas y comenta sobre lo que llame tu atención.", 19.2, 12.3], ["Escenario 1: Instrucciones de navegación", "Comienza tu recorrido aquí. Lee cuidadosamente las instrucciones de navegación para una mejor experiencia de aprendizaje dentro del mundo inmersivo: Presentaciones de Impacto.", 19.1, 58.4], ["Escenario 2: Objetivos del recorrido", "Accede a la imagen para que veas los objetivos generales y específicos de la experiencia de aprendizaje del recorrido en el mundo inmersivo. Tienes la opción de darle zoom o descargarlos.", 25.7, 57.0], ["Escenario 3: Desafío inicial: Presentaciones de impacto", "Accede al enlace y encontrarás un desafío inicial para evaluar tu conocimiento base sobre el tema y tu nivel como presentador/a.", 31.5, 58.8], ["Escenario 4: Antes de la presentación", "Esta es la primera parte del contenido del recorrido. Accede al enlace y te abrirá otra pantalla con una presentación. Navega la presentación para que descubras esos «tips» prácticos que son importantes considerar antes de presentar.", 44.1, 59.4], ["Escenario 5: Durante la presentación", "Accede al enlace y te abrirá otra pantalla con la segunda parte del contenido donde escucharás un video sobre Delivery memorable. Ahí descubrirás cómo hacer de tu ejecución durante la presentación una memorable. El video te abrirá en YouTube y tienes la opción de activar subtítulos.", 54.0, 59.0], ["Escenario 6: Después de la presentación", "Accede al enlace y te llevará a otra pantalla donde verás una infografía sobre qué es importante hacer luego de una presentación para mejora continua. Podrás darle zoom para verla mejor.", 64.2, 58.5], ["Escenario 7: Desafío final presentaciones de impacto", "Luego del recorrido y estudiar los recursos educativos Antes, Durante y Después de una presentación accede al enlace y encontrarás un desafío final para evaluar cuánto aprendiste y tu nivel como presentador/a. Descubre si mejoraste tu nivel.", 77.8, 58.6], ["Escenario 8: Reflexión: Mi estilo de comunicación como presentador/a", "Reflexiona sobre tu propio estilo como comunicador/a. Accede al enlace para que completes la reflexión sobre tu estilo de comunicación como presentador y tus áreas de fortaleza y oportunidad. El documento te abrirá en otra pantalla y tienes la opción de completarlo y enviarlo por correo electrónico, imprimirlo o guardarlo como PDF. Registra la fecha para que lo repitas en el futuro y puedas ver tu evolución como presentador/a.", 84.6, 58.7], ["Escenario 9: Infografía: 10 reglas para presentaciones de impacto", "Accede al enlace de esta infografía que presenta un resumen del contenido del recorrido. Tienes la opción de darle zoom para verlo más grande. Sugiero que le des download para que veas y guardes una versión más extensa con información adicional.", 92.8, 53.0], ["Sasha: Tu asistente en el mundo inmersivo", "Si tienes dudas sobre cómo navegar el mundo inmersivo accede a las tres estrellitas en el chat y pregunta a Sasha lo que necesites. Ella está para guiarte en tu recorrido.", 79.9, 76.3], ["Escenario 10: Práctica con impacto (opcional)", "¿Quieres llevar tu experiencia a otro nivel y poner en práctica lo aprendido? Accede al enlace que se encuentra en el label que dice Práctica aquí debajo del podio en el FRAME VR y sube un video corto donde te grabes presentando. Al abrir el enlace encontrarás un documento con las instrucciones de lo que se sugiere grabar, cómo subir el archivo y unas preguntas reflexivas. Envía el documento completado y el video y recibe retroalimentación de la facilitadora. El escenario es tuyo. ¡Conviértete en tu mejor versión como presentador/a!", 52.6, 69.5], ["Barra de navegación de FRAME VR", "Utiliza la barra inferior para acceder a las herramientas disponibles de FRAME VR, como micrófono, cámara, configuración y navegación.", 49.8, 85.4]];const scene=document.getElementById('scene'),overlay=document.getElementById('overlay'),heading=document.getElementById('heading'),body=document.getElementById('body'),action=document.getElementById('action');let last=null;items.forEach((item,i)=>{const b=document.createElement('button');b.className='spot';b.style.left=item[2]+'%';b.style.top=item[3]+'%';b.title=item[0];b.setAttribute('aria-label',item[0]);b.addEventListener('click',()=>{last=b;heading.textContent=item[0];body.textContent=item[1];const url=links[i];action.style.display=url?'inline-block':'none';if(url)action.href=url;overlay.classList.add('show');document.getElementById('close').focus()});scene.appendChild(b)});function close(){overlay.classList.remove('show');last?.focus()}document.getElementById('close').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});const links={/* Ejemplo: 3:'https://tuenlace.com' */};</script></body></html>
